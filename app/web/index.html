<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مولّد الجذاذة – التربية الإسلامية</title>
<style>
:root{--ink:#102a43;--navy:#0b2e4f;--teal:#0f8b8d;--mint:#e9f7f5;--gold:#d7a63d;--bg:#f4f7fa;--card:#fff;--line:#dce6ee;--muted:#6b7d8f;--danger:#b84a4a;--shadow:0 18px 45px rgba(16,42,67,.09);--sidebar:#092b49}body.dark{--ink:#e7f0f4;--navy:#b8d9e4;--teal:#46c6c0;--mint:#143b3d;--bg:#111b24;--card:#182732;--line:#2b4655;--muted:#a9bac3;--danger:#ff9e9e;--sidebar:#0a1b2c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}body{overflow-y:auto}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:276px;flex:0 0 276px;min-height:100vh;padding:24px 16px;background:var(--sidebar);color:#fff;box-shadow:10px 0 30px #082b4c1c;transition:width .2s ease}.sidebar.collapsed{width:82px;flex-basis:82px}.sidebar.collapsed .brand div,.sidebar.collapsed .nav button span:not(.ico),.sidebar.collapsed .side-footer{display:none}.sidebar.collapsed .brand{justify-content:center}.sidebar.collapsed .nav button{text-align:center}.icon{width:18px;height:18px;vertical-align:-4px;fill:currentColor}.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}body.dark .stat,body.dark .search,body.dark .field input,body.dark .field textarea,body.dark .field select,body.dark .ghost{background:#1e303c;color:var(--ink)}body.dark .lessons th,body.dark .preview-meta b{background:#203744}body.dark .hero{background:#17363b}.brand{display:flex;gap:12px;align-items:center;padding:5px 8px 25px;border-bottom:1px solid #ffffff22}.brand img{width:52px;height:52px;border-radius:16px;object-fit:cover;box-shadow:0 8px 18px #061d2d45}.brand b{display:block;font-size:17px}.brand small{display:block;color:#c7e2e8;margin-top:4px}.nav{display:grid;gap:7px;margin-top:25px}.side-footer{position:absolute;bottom:24px;color:#b8d2db;font-size:12px;line-height:1.8;padding:0 10px}.sidebar{position:relative}.nav button{border:1px solid transparent;background:transparent;color:#d9edf2;text-align:right;border-radius:12px;padding:13px 14px;transition:.18s}.nav button:hover,.nav button.active{background:#ffffff18;border-color:#ffffff18;color:#fff;transform:translateX(-2px)}.nav .ico{display:inline-grid;place-items:center;width:29px;color:#f2c96b;font-size:18px}.main{min-width:0;flex:1;padding:30px 42px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.save-state{font-size:12px;color:var(--muted);white-space:nowrap}.eyebrow{font-size:13px;font-weight:800;color:var(--teal);letter-spacing:.2px}.title{font-size:30px;font-weight:850;line-height:1.25;margin:4px 0}.subtitle{color:var(--muted);font-size:14px}.top-logo{width:50px;height:50px;border-radius:15px;object-fit:cover}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:23px;margin-bottom:18px}.hero{min-height:220px;display:flex;align-items:center;justify-content:space-between;gap:25px;overflow:hidden;background:linear-gradient(110deg,#e5f6f4,#fff 70%)}.hero h2{font-size:26px;margin:0 0 8px}.hero p{color:var(--muted);margin:0;max-width:620px}.hero img{width:155px;height:155px;object-fit:cover;border-radius:40px;box-shadow:0 15px 35px #0b526d2c}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary,.secondary,.danger,.ghost{border-radius:11px;padding:11px 17px;font-weight:750;border:1px solid transparent}.primary{background:var(--teal);color:#fff}.primary:hover{background:#087375}.secondary{background:#e8f2f5;color:var(--navy)}.secondary:hover{background:#dcebef}.danger{background:#fff1f1;color:var(--danger)}.ghost{background:#fff;border-color:var(--line);color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{padding:19px;border:1px solid var(--line);border-radius:15px;background:#fbfdfe}.stat span{display:block;color:var(--muted);font-size:13px}.stat b{display:block;font-size:24px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}.section-head h2,.section-head h3{margin:0}.pill{display:inline-flex;background:var(--mint);color:#087375;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;white-space:nowrap}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.search{min-width:260px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.tablewrap{overflow:auto}.lessons{width:100%;border-collapse:collapse}.lessons th,.lessons td{padding:14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.lessons th{background:#f2f7f9;color:#436174}.empty{text-align:center!important;color:var(--muted);padding:42px!important}.editor-layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:18px;align-items:start}.stage-nav{position:sticky;top:20px;padding:17px;max-height:calc(100vh - 155px);overflow:auto}.stage-nav h3{margin:2px 4px 15px}.stage-item{display:flex;align-items:center;gap:9px;width:100%;border:1px solid transparent;border-radius:11px;background:#f7fafc;color:var(--ink);padding:11px;text-align:right;margin:6px 0}.stage-item:hover{border-color:#b8dfe0}.stage-item.active{background:var(--mint);border-color:#9bd9d7;color:#087375;font-weight:800}.num{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#dfebf0;color:var(--navy);font-size:12px;flex:none}.stage-item.active .num{background:var(--teal);color:#fff}.form-card{min-width:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800;color:#43576b}.field input,.field textarea,.field select{width:100%;border:1px solid #d4e0e8;border-radius:10px;background:#fbfdfe;padding:11px 12px;color:var(--ink);outline:none}.field textarea{min-height:95px;resize:vertical;line-height:1.65}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f8b8d18}.stage-note{border-right:4px solid var(--teal);background:#f1faf9;color:var(--muted);padding:13px 15px;border-radius:10px;line-height:1.7;margin-bottom:19px}.auto-panel{background:linear-gradient(135deg,#f7fbfc,#f0faf8);border:1px solid #cfe7e5;border-radius:14px;padding:15px;margin:18px 0}.auto-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.auto-title b{color:#0a7072}.auto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.auto-box{background:#fff;border:1px solid #dcebea;border-radius:11px;padding:11px}.auto-box h4{font-size:12px;margin:0 0 8px;color:#40616d}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#e9f7f5;color:#087375;border-radius:999px;padding:5px 8px;font-size:11px}.repeat{background:#fbfdfe;border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0}body.dark .repeat,body.dark .auto-box{background:#1b2d38}.stage-actions{display:flex;gap:6px;align-items:center}.stage-actions button{min-width:34px;padding:8px 10px}.tooltip{position:relative}.tooltip:hover::after{content:attr(data-tip);position:absolute;z-index:40;right:0;top:calc(100% + 6px);white-space:nowrap;background:#102a43;color:#fff;border-radius:7px;padding:5px 8px;font-size:11px}.repeat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.repeat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.toast{position:fixed;left:24px;bottom:24px;display:none;background:var(--navy);color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:30}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#082b4c99;z-index:20}.modal .card{width:min(1180px,96vw);max-height:92vh;overflow:auto}.preview-meta{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #333;margin-bottom:14px}.preview-meta div{display:flex;border-left:1px solid #333;border-bottom:1px solid #333;min-height:38px}.preview-meta div:nth-child(4n){border-left:0}.preview-meta div:nth-last-child(-n+4){border-bottom:0}.preview-meta b{background:#eef1f3;padding:9px;width:38%;font-size:12px}.preview-meta span{padding:9px;flex:1}.preview-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;direction:rtl}.preview-table th,.preview-table td{border:1px solid #222;padding:10px 8px;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.preview-table th{background:#e5eaee;text-align:center}.preview-table th:nth-child(1),.preview-table td:nth-child(1){width:13%}.preview-table th:nth-child(2),.preview-table td:nth-child(2){width:48%}.preview-table th:nth-child(3),.preview-table td:nth-child(3){width:14%}.preview-table th:nth-child(4),.preview-table td:nth-child(4){width:12%}.preview-table th:nth-child(5),.preview-table td:nth-child(5){width:13%}.muted{color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.lesson-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sort-select{padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);outline:none}.sort-select:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f8b8d18}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-left:6px}.preview-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.print-sheet{background:#fff;padding:24px;border-radius:14px}.field input::placeholder,.field textarea::placeholder{color:#9aabba}@media print{body{background:#fff!important}.sidebar,.topbar,.toolbar,#toast,.modal>.card>.toolbar,.preview-actions{display:none!important}.modal{display:block!important;position:static!important;background:#fff!important;padding:0!important}.modal .card{width:100%!important;max-height:none!important;box-shadow:none!important;border:0!important;padding:0!important}.print-sheet{padding:0!important}.preview-table{font-size:10px!important}}@media(max-width:1050px){.main{padding:22px}.editor-layout{grid-template-columns:1fr}.stage-nav{position:static;max-height:290px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.app{display:block}.sidebar{width:100%;min-height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:15px}.stats,.grid,.auto-grid,.repeat-grid,.preview-meta{grid-template-columns:1fr}.hero img{width:95px;height:95px}.title{font-size:24px}.search{min-width:0;width:100%}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="card"><div class="toolbar"><div><div class="eyebrow">المعاينة النهائية</div><h2 style="margin:4px 0">جذاذة التربية الإسلامية</h2></div><button class="ghost" onclick="closePreview()">إغلاق</button></div><div id="preview"></div></div></div>
<script>
const ICON='tarbawi-icon.png';const SVG={home:'<path d="M3 10.5 12 3l9 7.5v8a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 18.5v-8Z"/><path d="M9 20v-5h6v5" fill="none" stroke="currentColor" stroke-width="1.8"/>',new:'<path d="M5 3h10l4 4v14H5A2 2 0 0 1 3 19V5a2 2 0 0 1 2-2Z"/><path d="M15 3v5h5M7 12h10M7 16h7" fill="none" stroke="currentColor" stroke-width="1.8"/>',lessons:'<path d="M4 4h16v16H4z"/><path d="M7 8h10M7 12h10M7 16h6" fill="none" stroke="currentColor" stroke-width="1.8"/>',template:'<path d="M4 4h16v16H4z"/><path d="M8 4v16M4 9h16" fill="none" stroke="currentColor" stroke-width="1.8"/>',settings:'<path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Z"/><path d="m19.4 15 .1 2-2 1.2-1.6-1a8 8 0 0 1-1.7 1l-.4 1.9H10l-.4-1.9a8 8 0 0 1-1.7-1l-1.6 1-2-1.2.1-2a8 8 0 0 1-.8-1.5l-1.8-.7v-2.4l1.8-.7A8 8 0 0 1 4.4 8l-.1-2 2-1.2 1.6 1a8 8 0 0 1 1.7-1L10 3h2l.4 1.8a8 8 0 0 1 1.7 1l1.6-1 2 1.2-.1 2a8 8 0 0 1 .8 1.5l1.8.7v2.4l-1.8.7a8 8 0 0 1-1 1.7Z" fill="none" stroke="currentColor" stroke-width="1.4"/>',backup:'<path d="M12 3v11M8 10l4 4 4-4M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="1.8"/>',sun:'<circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.8"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8"/>',up:'<path d="m6 10 6-6 6 6M12 4v16" fill="none" stroke="currentColor" stroke-width="1.8"/>',down:'<path d="m6 14 6 6 6-6M12 20V4" fill="none" stroke="currentColor" stroke-width="1.8"/>',save:'<path d="M4 4h13l3 3v13H4z"/><path d="M8 4v6h7V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.6"/>',eye:'<path d="M2.5 12s3.2-5 9.5-5 9.5 5 9.5 5-3.2 5-9.5 5-9.5-5-9.5-5Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/>',word:'<path d="M4 4h12l4 4v12H4z"/><path d="M16 4v5h5M7 12l1.3 5 1.7-3.4 1.7 3.4L13 12" fill="none" stroke="currentColor" stroke-width="1.5"/>',plus:'<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8"/>'};function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${SVG[n]||SVG.new}</svg>`}
const AUTO={diagnostic:{abilities:['استحضار المكتسبات السابقة','التعبير الشفهي','تشخيص التعلمات'],aids:['أسئلة التقويم التشخيصي','سبورة القسم'],indicators:['يستحضر المتعلم مكتسباته السابقة','يجيب عن الأسئلة الأولية','يحدد مكامن القوة والتعثر']},problem:{abilities:['الملاحظة والفهم','طرح التساؤلات','اقتراح الفرضيات'],aids:['الوضعية المشكلة','نص أو صورة أو سند منطلق','سبورة القسم'],indicators:['يفهم عناصر الوضعية','يحدد السؤال الإشكالي','يقترح فرضية مع تعليل أولي']},task:{abilities:['الفهم والتحليل','الاستدلال والمناقشة','التعاون وبناء التعلم'],aids:['النصوص الشرعية أو السندات','الكتاب المدرسي','السبورة والوسائل التعليمية'],indicators:['يستثمر السندات بشكل سليم','ينجز المهمة وفق المطلوب','يبني خلاصة مرتبطة بالدرس']},formative:{abilities:['الاستيعاب والتطبيق','التعبير عن التعلمات','التصحيح الذاتي'],aids:['أسئلة التقويم المرحلي','شبكة التقويم','دفتر المتعلم'],indicators:['يجيب عن أسئلة التقويم','يوظف المفاهيم المكتسبة','يصوب أخطاءه اعتماداً على التغذية الراجعة']},scrutiny:{abilities:['النقد والتمحيص','الاستدلال','إصدار الحكم'],aids:['الفرضيات السابقة','السندات والأدلة الشرعية','شبكة تمحيص الفرضيات'],indicators:['يقارن الفرضية بالأدلة','يصدر حكماً معللاً','يميز بين الصحيح وما يحتاج إلى تعديل']},values:{abilities:['استخراج القيم','الربط بين التعلم والسلوك','الالتزام والمسؤولية'],aids:['النصوص والسندات','مواقف حياتية','شبكة استثمار القيم'],indicators:['يستخرج قيمة من التعلم','يستدل عليها من النص أو النشاط','يقترح سلوكاً يجسدها']},summative:{abilities:['التركيب والتقويم','توظيف التعلمات','الاستقلالية'],aids:['وضعية إدماجية','أسئلة التقويم الإجمالي','شبكة التصحيح'],indicators:['يوظف مكتسباته في وضعية جديدة','ينظم جوابه ويعلله','يحقق الهدف التعلمي']},self_learning:{abilities:['التعلم الذاتي','البحث والاستقصاء','تنظيم العمل'],aids:['الكتاب المدرسي','مصادر موثوقة يحددها الأستاذ','بطاقة التعلم الذاتي'],indicators:['ينجز المهمة باستقلالية','ينتج أثراً قابلاً للتقويم','يستعد للتعلم اللاحق']}};
let state={lessons:[],templates:[],settings:{}};let current=null,activeStage=0,view='home',lessonSort='updated',lessonQuery='';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(name,...args){return window.pywebview?.api?await window.pywebview.api[name](...args):null}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)}
function ensureStage(s){const d=AUTO[s.kind]||{};['abilities','aids','indicators'].forEach(k=>{if(!Array.isArray(s[k])||!s[k].length)s[k]=[...(d[k]||[])];});return s}
function ensureCurrent(){(current?.stages||[]).forEach(ensureStage)}
function shell(){return `<div class="app"><aside id="sidebar" class="sidebar"><div class="brand"><img src="${ICON}"><div><b>مولّد الجذاذة</b><small>التربية الإسلامية</small></div></div><div class="nav"><button class="${view==='home'?'active':''}" onclick="go('home')"><span class="ico">${icon('home')}</span><span>الرئيسية</span></button><button class="${view==='editor'?'active':''}" onclick="newLesson()"><span class="ico">${icon('new')}</span><span>جذاذة جديدة</span></button><button class="${view==='lessons'?'active':''}" onclick="go('lessons')"><span class="ico">${icon('lessons')}</span><span>جذاذاتي</span></button><button class="${view==='templates'?'active':''}" onclick="go('templates')"><span class="ico">${icon('template')}</span><span>القوالب</span></button><button onclick="go('settings');setTimeout(()=>document.querySelector('.data-card')?.scrollIntoView({behavior:'smooth'}),50)"><span class="ico">${icon('backup')}</span><span>النسخ الاحتياطي</span></button><button class="${view==='settings'?'active':''}" onclick="go('settings')"><span class="ico">${icon('settings')}</span><span>الإعدادات</span></button></div><div class="side-footer">الإصدار 2.0<br><span id="sideSave">بيانات محلية محفوظة</span></div></aside><main class="main">${content()}</main></div>`}
function header(title,sub){return `<div class="topbar"><div><div class="eyebrow">مولّد الجذاذة – التربية الإسلامية</div><div class="title">${title}</div><div class="subtitle">${sub||''}</div></div><div class="top-actions"><span class="save-state">${state.last_saved?'آخر حفظ: '+new Date(state.last_saved).toLocaleTimeString('ar-MA'):'جاهز للعمل محلياً'}</span><button class="icon-btn tooltip" data-tip="طي أو فتح القائمة" onclick="toggleSidebar()">${icon('menu')}</button><button class="icon-btn tooltip" data-tip="تبديل الوضع" onclick="toggleDark()">${icon('sun')}</button><img class="top-logo" src="${ICON}"></div></div>`}
function content(){if(view==='home')return home();if(view==='lessons')return lessons();if(view==='templates')return templates();if(view==='settings')return settings();return editor()}
function home(){const last=state.lessons?.[state.lessons.length-1];return header('مرحباً بك','أنشئ جذاذاتك التعليمية وفق النموذج التربوي المعتمد')+`<section class="card hero"><div><h2>من الفكرة إلى جذاذة جاهزة</h2><p>تحرير عربي واضح، تعبئة تلقائية للقدرات والمعينات ومؤشرات التقويم، ومعاينة جدولية قريبة من النموذج المرجعي.</p><div class="actions" style="margin-top:19px"><button class="primary" onclick="newLesson()">＋ إنشاء جذاذة جديدة</button><button class="secondary" onclick="go('lessons')">عرض جذاذاتي</button></div></div><img src="${ICON}"></section><div class="stats"><div class="stat"><span>عدد الجذاذات المحفوظة</span><b>${state.lessons?.length||0}</b></div><div class="stat"><span>آخر درس</span><b style="font-size:17px">${esc(last?.lesson_title||last?.title||'لا توجد بيانات')}</b></div><div class="stat"><span>نمط العمل</span><b style="font-size:17px;color:var(--teal)">محلي وآمن</b></div></div><section class="card" style="margin-top:18px"><div class="section-head"><h2>بنية النموذج المعتمدة</h2><span class="pill">11 مرحلة ثابتة</span></div><p class="muted">التقويم التشخيصي، تقديم الوضعية المشكلة، المهمة الأولى، التقويم المرحلي، التقويم التشخيصي، المهمة الثانية، التقويم المرحلي، تمحيص الفرضيات، القيم المستنبطة، التقويم الإجمالي، والتعلم الذاتي.</p></section>`}
function lessons(){const list=sortLessons(state.lessons||[],lessonSort);const rows=list.map(l=>`<tr><td><b><span class="status-dot"></span>${esc(l.lesson_title||l.title||'جذاذة بدون عنوان')}</b></td><td>${esc(l.level||'—')}</td><td>${esc(l.school_year||'—')}</td><td>${esc((l.created_at||'').replace('T',' ')||'—')}</td><td>${esc((l.updated_at||'').replace('T',' ')||'—')}</td><td><button class="secondary" aria-label="فتح الجذاذة" onclick="editLesson('${l.id}')">فتح</button> <button class="ghost" aria-label="نسخ الجذاذة" onclick="copyLesson('${l.id}')">نسخ</button> <button class="danger" aria-label="حذف الجذاذة" onclick="removeLesson('${l.id}')">حذف</button></td></tr>`).join('');return header('جذاذاتي','إدارة الجذاذات المحفوظة محلياً والبحث فيها')+`<section class="card"><div class="lesson-toolbar"><input class="search" id="search" aria-label="البحث في الجذاذات" value="${esc(lessonQuery)}" placeholder="ابحث بعنوان الدرس أو المستوى أو الأستاذ..." oninput="lessonQuery=this.value;filterLessons()"><label class="sr-only" for="lessonSort">فرز الجذاذات</label><select class="sort-select" id="lessonSort" aria-label="فرز الجذاذات" onchange="lessonSort=this.value;render()"><option value="updated">الأحدث تعديلاً</option><option value="created">الأحدث إنشاءً</option><option value="title">حسب العنوان</option><option value="level">حسب المستوى</option></select><button class="primary" onclick="newLesson()">＋ جذاذة جديدة</button></div><div class="tablewrap"><table class="lessons"><thead><tr><th>عنوان الدرس</th><th>المستوى</th><th>السنة الدراسية</th><th>تاريخ الإنشاء</th><th>آخر تعديل</th><th>الإجراءات</th></tr></thead><tbody id="lessonRows">${rows||'<tr><td colspan="6" class="empty">لا توجد جذاذات محفوظة بعد. أنشئ أول جذاذة من الزر أعلاه.</td></tr>'}</tbody></table></div></section>`}function sortLessons(items,mode){return [...items].sort((a,b)=>{if(mode==='title')return String(a.lesson_title||a.title||'').localeCompare(String(b.lesson_title||b.title||''),'ar');if(mode==='level')return String(a.level||'').localeCompare(String(b.level||''),'ar');const key=mode==='created'?'created_at':'updated_at';return String(b[key]||'').localeCompare(String(a[key]||''))})}
function filterLessons(){const q=(lessonQuery||document.getElementById('search')?.value||'').trim().toLocaleLowerCase('ar');document.querySelectorAll('#lessonRows tr').forEach(r=>r.style.display=r.textContent.toLocaleLowerCase('ar').includes(q)?'':'none')}
function templates(){return header('القوالب','المراحل ثابتة، والحقول التربوية تُستكمل تلقائياً')+`<section class="card"><div class="section-head"><h2>القالب الأساسي للجذاذة</h2><span class="pill">11 مرحلة</span></div><p class="muted">يحافظ القالب على ترتيب النموذج المرجعي، ويقترح تلقائياً القدرات والمعينات ومؤشرات التقويم لكل مرحلة.</p><button class="primary" onclick="newLesson()">استخدام القالب</button></section>`}
function settings(){return header('الإعدادات','بيانات الأستاذ والنسخ الاحتياطي المحلي')+`<section class="card"><div class="grid"><div class="field"><label>اسم الأستاذ</label><input id="setTeacher" value="${esc(state.settings?.teacher)}"></div><div class="field"><label>المؤسسة</label><input id="setInstitution" value="${esc(state.settings?.institution)}"></div></div><button class="primary" style="margin-top:18px" onclick="saveSettings()">حفظ الإعدادات</button></section><section class="card data-card"><h2>البيانات</h2><p class="muted">يمكنك حفظ نسخة احتياطية أو استرجاع بيانات سابقة من جهازك.</p><div class="actions"><button class="secondary" onclick="backup()">نسخ احتياطي</button><button class="secondary" onclick="restore()">استرجاع نسخة</button></div></section>`}
function newLesson(){const stages=JSON.parse(JSON.stringify(state.templates?.[0]?.stages||[]));if(!stages.length){alert('لم يتم العثور على القالب الأساسي');return}const settings=state.settings||{};current={id:crypto.randomUUID?.()||Date.now().toString(),title:'جذاذة جديدة',lesson_title:'',subject:'التربية الإسلامية',institution:settings.institution||'',teacher:settings.teacher||'',domain:'التزكية (عقيدة)',stages,created_at:new Date().toISOString(),updated_at:new Date().toISOString()};ensureCurrent();activeStage=0;view='editor';render()}
function editLesson(id){current=JSON.parse(JSON.stringify(state.lessons.find(x=>x.id===id)));ensureCurrent();activeStage=0;view='editor';render()}
async function copyLesson(id){const r=await api('copy_lesson',id);if(r?.ok){state.lessons.push(r.lesson);toast('تم نسخ الجذاذة');render()}else{const x=JSON.parse(JSON.stringify(state.lessons.find(x=>x.id===id)));x.id=Date.now().toString();x.title=(x.lesson_title||x.title)+' – نسخة';state.lessons.push(x);await api('save_lesson',x);render()}}
function editor(){if(!current)return home();ensureCurrent();const s=current.stages[activeStage]||{};return header('محرر الجذاذة','تظهر الحقول التربوية التلقائية أسفل كل مرحلة ويمكن تعديلها عند الحاجة')+`<div class="toolbar"><div class="actions"><button class="primary" onclick="saveCurrent()">حفظ الجذاذة</button><button class="secondary" onclick="openPreview()">معاينة وتصدير</button></div><button class="ghost" onclick="go('lessons')">رجوع إلى جذاذاتي</button></div><div class="editor-layout"><section class="card stage-nav"><h3>مراحل النموذج</h3>${current.stages.map((x,i)=>`<button class="stage-item ${i===activeStage?'active':''}" onclick="activeStage=${i};render()"><span class="num">${i+1}</span><span>${esc(x.name)}</span></button>`).join('')}</section><section class="card form-card">${activeStage===0?basics():stageForm(s)}</section></div>`}
function basics(){const fields=[['المؤسسة','institution'],['الأكاديمية','academy'],['المديرية','directorate'],['الأستاذ','teacher'],['المستوى','level'],['السنة الدراسية','school_year'],['المدخل','entry'],['المجال','domain'],['الوحدة','unit'],['عنوان الدرس','lesson_title'],['عدد الحصص','sessions'],['مدة الحصة','period'],['التاريخ','date']];return `<div class="section-head"><h2>المعلومات الأساسية</h2><span class="pill">بيانات الجذاذة</span></div><div class="grid">${fields.map(([l,k])=>`<div class="field"><label>${l}</label><input value="${esc(current[k])}" onchange="current['${k}']=this.value"></div>`).join('')}<div class="field full"><label>الكفاية</label><textarea onchange="current.competency=this.value">${esc(current.competency)}</textarea></div><div class="field full"><label>الأهداف والموارد والمراجع</label><textarea onchange="current.objectives=this.value.split('\\n')">${esc((current.objectives||[]).join('\n'))}</textarea></div></div><div class="stage-note" style="margin-top:18px"><b>ملاحظة:</b> عند الانتقال إلى أي مرحلة ستظهر تلقائياً القدرات والمعينات ومؤشرات التقويم الخاصة بها وفق القالب التربوي.</div>`}
function stageForm(s){const common=`<div class="stage-note"><div class="section-head" style="margin:0 0 8px;padding-bottom:8px"><b>${esc(s.name)}</b><div class="stage-actions"><button class="ghost tooltip" data-tip="نقل المرحلة إلى الأعلى" onclick="moveStage(-1)">${icon('up')}</button><button class="ghost tooltip" data-tip="نقل المرحلة إلى الأسفل" onclick="moveStage(1)">${icon('down')}</button></div></div>${esc(s.purpose||'')}</div>`;let body='';if(s.kind==='problem')body=textField('الوضعية المشكلة','problem',s)+textField('دراسة الوضعية والتفاعل','study_text',s)+repeatHyp(s);else if(s.kind==='task')body=['title','goal','duration','teacher','learner','summary'].map((k,i)=>textField(['عنوان المهمة','الهدف','المدة','أنشطة الأستاذ','أنشطة المتعلم','الخلاصة'][i],k,s)).join('')+repeatSimple(s,'activities','الأنشطة الديداكتيكية')+repeatSimple(s,'evidences','السندات')+repeatQuestions(s);else if(['diagnostic','formative','summative'].includes(s.kind))body=repeatQuestions(s);else if(s.kind==='scrutiny')body=scrutiny(s);else if(s.kind==='values')body=repeatValues(s);else if(s.kind==='self_learning')body=['task','instructions','product','resources','deadline'].map((k,i)=>textField(['المهمة','التعليمات','المنتوج المنتظر','الموارد','الأجل'][i],k,s)).join('');else body=repeatSimple(s,'activities','الأنشطة');return common+autoPanel(s)+body+`<button class="primary" onclick="saveCurrent()">حفظ هذه المرحلة</button>`}
function autoPanel(s){return `<section class="auto-panel"><div class="auto-title"><b>التعبئة التربوية التلقائية</b><span class="pill">قابلة للتعديل</span></div><div class="auto-grid">${[['القدرات المستهدفة','abilities'],['المعينات الديداكتيكية','aids'],['مؤشرات التقويم','indicators']].map(([l,k])=>`<div class="auto-box"><h4>${l}</h4><div class="chips">${(s[k]||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><textarea style="margin-top:9px;min-height:70px" onchange="current.stages[${activeStage}]['${k}']=this.value.split('\\n').filter(Boolean)">${esc((s[k]||[]).join('\n'))}</textarea></div>`).join('')}</div></section>`}
function textField(label,key,obj){return `<div class="field" style="margin-bottom:13px"><label>${label}</label><textarea onchange="current.stages[${activeStage}]['${key}']=this.value">${esc(obj[key]||'')}</textarea></div>`}
function repeatHyp(s){s.hypotheses=s.hypotheses||[];return `<div class="section-head"><h3>الفرضيات وتعليلاتها</h3><button class="secondary" onclick="addItem('hypotheses',{text:'',original_reason:''})">＋ إضافة فرضية</button></div>${s.hypotheses.map((x,i)=>`<div class="repeat"><div class="repeat-head"><b>الفرضية ${i+1}</b><button class="danger" onclick="delItem('hypotheses',${i})">حذف</button></div><div class="repeat-grid"><div class="field"><label>الفرضية الأصلية</label><textarea onchange="current.stages[${activeStage}].hypotheses[${i}].text=this.value">${esc(x.text)}</textarea></div><div class="field"><label>التعليل الأصلي</label><textarea onchange="current.stages[${activeStage}].hypotheses[${i}].original_reason=this.value">${esc(x.original_reason)}</textarea></div></div></div>`).join('')}`}
function repeatSimple(s,key,title){s[key]=s[key]||[];return `<div class="section-head"><h3>${title}</h3><button class="secondary" onclick="addItem('${key}',{text:''})">＋ إضافة</button></div>${s[key].map((x,i)=>`<div class="repeat"><div class="repeat-head"><b>العنصر ${i+1}</b><button class="danger" onclick="delItem('${key}',${i})">حذف</button></div><textarea onchange="current.stages[${activeStage}]['${key}'][${i}].text=this.value">${esc(x.text||x)}</textarea></div>`).join('')}`}
function repeatQuestions(s){s.questions=s.questions||[];return `<div class="section-head"><h3>الأسئلة والأجوبة المتوقعة</h3><button class="secondary" onclick="addItem('questions',{question:'',expected:''})">＋ إضافة سؤال</button></div>${s.questions.map((x,i)=>`<div class="repeat"><div class="repeat-head"><b>السؤال ${i+1}</b><button class="danger" onclick="delItem('questions',${i})">حذف</button></div><div class="repeat-grid"><div class="field"><label>السؤال</label><textarea onchange="current.stages[${activeStage}].questions[${i}].question=this.value">${esc(x.question)}</textarea></div><div class="field"><label>الإجابة المتوقعة</label><textarea onchange="current.stages[${activeStage}].questions[${i}].expected=this.value">${esc(x.expected)}</textarea></div></div></div>`).join('')}`}
function repeatValues(s){s.values=s.values||[];return `<div class="section-head"><h3>القيم المستنبطة</h3><button class="secondary" onclick="addItem('values',{name:'',evidence:'',explanation:'',behaviors:''})">＋ إضافة قيمة</button></div>${s.values.map((x,i)=>`<div class="repeat"><div class="repeat-head"><b>القيمة ${i+1}</b><button class="danger" onclick="delItem('values',${i})">حذف</button></div><div class="repeat-grid">${[['اسم القيمة','name'],['الدليل','evidence'],['الشرح','explanation'],['مظاهرها السلوكية','behaviors']].map(([l,k])=>`<div class="field"><label>${l}</label><textarea onchange="current.stages[${activeStage}].values[${i}]['${k}']=this.value">${esc(x[k])}</textarea></div>`).join('')}</div></div>`).join('')}`}
function scrutiny(s){const src=current.stages.find(x=>x.kind==='problem')||{};s.results=s.results||[];while(s.results.length<(src.hypotheses||[]).length)s.results.push({});return `<p class="muted">تنتقل الفرضيات السابقة تلقائياً إلى هذه المرحلة لتسجيل الحكم والدليل والتعليل النهائي.</p>${(src.hypotheses||[]).map((h,i)=>`<div class="repeat"><b>الفرضية ${i+1}: ${esc(h.text)}</b><p class="muted">التعليل الأصلي: ${esc(h.original_reason)}</p><div class="repeat-grid"><div class="field"><label>الحكم</label><select onchange="current.stages[${activeStage}].results[${i}].judgment=this.value"><option value="">اختر الحكم</option><option ${s.results[i].judgment==='صحيحة'?'selected':''}>صحيحة</option><option ${s.results[i].judgment==='غير صحيحة'?'selected':''}>غير صحيحة</option><option ${s.results[i].judgment==='تحتاج إلى تعديل'?'selected':''}>تحتاج إلى تعديل</option></select></div><div class="field"><label>الدليل</label><textarea onchange="current.stages[${activeStage}].results[${i}].evidence=this.value">${esc(s.results[i].evidence)}</textarea></div><div class="field full"><label>التعليل النهائي</label><textarea onchange="current.stages[${activeStage}].results[${i}].final_reason=this.value">${esc(s.results[i].final_reason)}</textarea></div></div></div>`).join('')}`}
function addItem(k,v){current.stages[activeStage][k]=current.stages[activeStage][k]||[];current.stages[activeStage][k].push(v);render()}function moveStage(step){const ni=activeStage+step;if(ni<0||ni>=current.stages.length)return;[current.stages[activeStage],current.stages[ni]]=[current.stages[ni],current.stages[activeStage]];activeStage=ni;saveCurrent();render()}function toggleSidebar(){const s=document.getElementById('sidebar');s?.classList.toggle('collapsed');localStorage.setItem('tarbawi-sidebar',s?.classList.contains('collapsed')?'1':'0')}function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('tarbawi-dark',document.body.classList.contains('dark')?'1':'0')}function delItem(k,i){current.stages[activeStage][k].splice(i,1);render()}
async function saveCurrent(){ensureCurrent();current.updated_at=new Date().toISOString();state.last_saved=current.updated_at;const i=state.lessons.findIndex(x=>x.id===current.id);if(i<0)state.lessons.push(JSON.parse(JSON.stringify(current)));else state.lessons[i]=JSON.parse(JSON.stringify(current));const r=await api('save_lesson',current);if(r?.lesson){const j=state.lessons.findIndex(x=>x.id===current.id);if(j>=0)state.lessons[j]=r.lesson;current=r.lesson}toast('تم حفظ الجذاذة والحقول التربوية تلقائياً')}
async function saveSettings(){state.settings.teacher=document.getElementById('setTeacher').value;state.settings.institution=document.getElementById('setInstitution').value;state.last_saved=new Date().toISOString();const r=await api('save_settings',state.settings);if(r?.settings)state.settings=r.settings;toast('تم حفظ الإعدادات محلياً');render()}
async function removeLesson(id){if(confirm('هل تريد حذف الجذاذة؟')){state.lessons=state.lessons.filter(x=>x.id!==id);await api('delete_lesson',id);render();toast('تم حذف الجذاذة')}}
async function backup(){const r=await api('backup');if(r?.ok)toast('تم إنشاء النسخة الاحتياطية')}async function restore(){const r=await api('restore');if(r?.ok){state=r.state;render();toast('تم الاسترجاع بنجاح')}}
async function openPreview(){ensureCurrent();await saveCurrent();const rows=current.stages.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(activity(s))}</td><td>${esc((s.abilities||[]).join('\n'))}</td><td>${esc((s.aids||[]).join('\n'))}</td><td>${esc((s.indicators||[]).join('\n'))}</td></tr>`).join('');const meta=[['المؤسسة',current.institution],['الأكاديمية',current.academy],['المديرية',current.directorate],['الأستاذ',current.teacher],['المستوى',current.level],['السنة الدراسية',current.school_year],['المادة',current.subject],['المدخل',current.entry],['المجال',current.domain],['الوحدة',current.unit],['عدد الحصص',current.sessions],['التاريخ',current.date]].map(x=>`<div><b>${esc(x[0])}</b><span>${esc(x[1]||'')}</span></div>`).join('');document.getElementById('preview').innerHTML=`<h2 style="text-align:center">جذاذة مادة التربية الإسلامية: ${esc(current.lesson_title||current.title)}</h2><div class="preview-meta">${meta}</div><table class="preview-table"><thead><tr><th>مراحل الدرس</th><th>الأنشطة الديداكتيكية التعلمية</th><th>القدرات المستهدفة</th><th>المعينات الديداكتيكية</th><th>مؤشرات التقويم</th></tr></thead><tbody>${rows}</tbody></table><div class="preview-actions" style="margin-top:18px"><button class="primary" onclick="doExport('docx')">تصدير Word</button><button class="secondary" onclick="doExport('pdf')">تصدير PDF</button><button class="secondary" onclick="doExport('html')">حفظ المعاينة</button><button class="ghost" onclick="printPreview()">طباعة</button></div>`;document.getElementById('modal').style.display='flex'}
function activity(s){let a=[];['problem','study_text','title','goal','teacher','learner','summary','task','instructions','product','resources','deadline'].forEach(k=>{if(s[k])a.push(s[k])});['questions','evidences','hypotheses','values','results','activities'].forEach(k=>(s[k]||[]).forEach(x=>a.push(typeof x==='object'?Object.values(x).filter(Boolean).join(' | '):x)));return a.join('\n')}
function closePreview(){document.getElementById('modal').style.display='none'}function printPreview(){window.print()}async function doExport(k){const r=await api('export',k,current);if(r?.ok)toast(`تم حفظ الملف في: ${r.path||'المكان الذي اخترته'}`);else if(r?.cancelled)toast('تم إلغاء الحفظ');else if(r?.error)alert(r.error)}function go(v){view=v;render()}function render(){document.getElementById('app').innerHTML=shell()}
window.addEventListener('pywebviewready',async()=>{const x=await api('state');if(x){state=x;(state.lessons||[]).forEach(ensureCurrent)}if(localStorage.getItem('tarbawi-dark')==='1')document.body.classList.add('dark');render()});if(localStorage.getItem('tarbawi-dark')==='1')document.body.classList.add('dark');render();
</script></body></html>
