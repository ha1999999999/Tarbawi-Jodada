<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مولّد الجذاذة – التربية الإسلامية</title>
<style>
:root{--navy:#082b4c;--blue:#11698e;--teal:#1a9aa8;--gold:#e6ad3d;--ink:#18324b;--muted:#6b7c8f;--bg:#f3f7fa;--card:#fff;--line:#dce6ee;--shadow:0 14px 35px #082b4c12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:270px;background:linear-gradient(165deg,#092e50,#0b4268);color:#fff;padding:26px 18px;flex:none;box-shadow:8px 0 25px #05243b18}.brand{display:flex;gap:12px;align-items:center;padding:8px 8px 32px;border-bottom:1px solid #ffffff1f}.brand img{width:48px;height:48px;border-radius:15px;object-fit:cover}.brand b{font-size:17px;display:block}.brand small{color:#c3dce9}.nav{margin-top:28px;display:grid;gap:7px}.nav button{color:#d7e7ef;background:transparent;text-align:right;border-radius:12px;padding:14px 16px;transition:.2s}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff;transform:translateX(-2px)}.nav .ico{display:inline-block;width:28px;color:#ffd16a}.main{flex:1;padding:30px 42px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{color:var(--teal);font-size:13px;font-weight:700}.title{font-size:29px;font-weight:800;margin:4px 0}.subtitle{color:var(--muted)}.iconbtn{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:11px;color:var(--ink)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px;margin-bottom:20px}.hero{background:linear-gradient(110deg,#e6f5f5,#fff);display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden}.hero h2{margin:0 0 8px;font-size:25px}.hero p{margin:0;color:var(--muted)}.hero img{width:150px;height:150px;object-fit:cover;border-radius:35px;box-shadow:0 12px 22px #082b4c25}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary{background:var(--teal);color:#fff;padding:12px 20px;border-radius:11px;font-weight:700}.secondary{background:#e8f1f5;color:var(--navy);padding:12px 18px;border-radius:11px;font-weight:700}.danger{background:#fff0f0;color:#b23a3a;padding:10px 15px;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{padding:20px;border-radius:15px;background:#f8fbfd;border:1px solid var(--line)}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:25px;margin-top:8px}.editor-layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:20px;direction:ltr}.editor-layout>*{direction:rtl}.stage-nav{max-height:calc(100vh - 185px);overflow:auto;position:sticky;top:20px}.stage-nav h3{margin-top:0}.stage-item{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:#f7fafc;color:var(--ink);border:1px solid transparent;padding:12px;border-radius:11px;margin:6px 0}.stage-item.active{background:#e4f5f5;border-color:#9ad8d9;color:#076172;font-weight:700}.num{width:25px;height:25px;border-radius:50%;background:#dceaf0;color:var(--navy);display:grid;place-items:center;font-size:12px;flex:none}.stage-item.active .num{background:var(--teal);color:#fff}.form-card{overflow:auto;max-height:calc(100vh - 185px)}.section-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:20px}.section-head h2{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700;color:#43576b}.field input,.field textarea,.field select{border:1px solid #d4e0e8;border-radius:10px;background:#fbfdfe;padding:11px 12px;outline:none;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px #1a9aa818}.stage-note{background:#f5fafb;border-right:4px solid var(--teal);padding:13px 15px;color:var(--muted);margin-bottom:20px;border-radius:9px}.repeat{border:1px solid var(--line);background:#fbfdfe;border-radius:12px;padding:15px;margin:10px 0}.repeat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.repeat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:20px;flex-wrap:wrap}.tablewrap{overflow:auto}.lessons{width:100%;border-collapse:collapse}.lessons th,.lessons td{padding:14px;text-align:right;border-bottom:1px solid var(--line)}.lessons th{background:#f3f8fa;color:#436174}.pill{background:#e6f5f5;color:#087183;border-radius:20px;padding:5px 10px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:45px}.toast{position:fixed;left:28px;bottom:24px;background:var(--navy);color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow);display:none}.modal{position:fixed;inset:0;background:#06213b88;display:none;align-items:center;justify-content:center;padding:20px}.modal .card{max-width:1100px;width:100%;max-height:90vh;overflow:auto}.preview-table{width:100%;border-collapse:collapse;font-size:12px}.preview-table th,.preview-table td{border:1px solid #718394;padding:9px;vertical-align:top}.preview-table th{background:#e4edf2}.muted{color:var(--muted)}@media(max-width:1000px){.sidebar{width:220px}.main{padding:22px}.grid{grid-template-columns:1fr 1fr}.editor-layout{grid-template-columns:1fr}.stage-nav{position:static;max-height:260px}.form-card{max-height:none}}@media(max-width:650px){.app{display:block}.sidebar{width:100%;padding:15px}.brand{padding-bottom:15px}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{white-space:nowrap}.main{padding:15px}.stats,.grid{grid-template-columns:1fr}.hero img{width:95px;height:95px}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="card"><div class="toolbar"><h2>معاينة الجذاذة</h2><button class="iconbtn" onclick="closePreview()">إغلاق</button></div><div id="preview"></div></div></div>
<script>
const ICON='tarbawi-icon.png';let state={lessons:[],templates:[],settings:{}};let current=null,activeStage=0,view='home';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(name,...args){if(window.pywebview?.api)return await window.pywebview.api[name](...args);return null}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)}
function shell(){return `<div class="app"><aside class="sidebar"><div class="brand"><img src="${ICON}"><div><b>مولّد الجذاذة</b><small>التربية الإسلامية</small></div></div><div class="nav"><button class="${view==='home'?'active':''}" onclick="go('home')"><span class="ico">⌂</span>الرئيسية</button><button class="${view==='editor'?'active':''}" onclick="newLesson()"><span class="ico">＋</span>جذاذة جديدة</button><button class="${view==='lessons'?'active':''}" onclick="go('lessons')"><span class="ico">▤</span>جذاذاتي</button><button class="${view==='templates'?'active':''}" onclick="go('templates')"><span class="ico">▦</span>القوالب</button><button class="${view==='settings'?'active':''}" onclick="go('settings')"><span class="ico">⚙</span>الإعدادات</button></div></aside><main class="main">${content()}</main></div>`}
function header(title,sub){return `<div class="topbar"><div><div class="eyebrow">مولّد الجذاذة – التربية الإسلامية</div><div class="title">${title}</div><div class="subtitle">${sub||''}</div></div><img src="${ICON}" style="width:48px;height:48px;border-radius:14px;object-fit:cover"></div>`}
function content(){if(view==='home')return home();if(view==='lessons')return lessons();if(view==='templates')return templates();if(view==='settings')return settings();return editor()}
function home(){let last=state.lessons?.[state.lessons.length-1];return header('مرحباً بك','أنشئ جذاذاتك التعليمية باحتراف ووضوح')+`<section class="card hero"><div><h2>ابدأ إعداد جذاذة جديدة</h2><p>قالب تربوي ثابت، حفظ محلي، ومعاينة وتصدير جاهزان للعمل.</p><div class="actions" style="margin-top:18px"><button class="primary" onclick="newLesson()">＋ إنشاء جذاذة</button><button class="secondary" onclick="go('lessons')">عرض جذاذاتي</button></div></div><img src="${ICON}"></section><div class="stats"><div class="stat"><span>عدد الجذاذات</span><b>${state.lessons?.length||0}</b></div><div class="stat"><span>آخر درس</span><b style="font-size:17px">${esc(last?.lesson_title||'لا توجد بيانات')}</b></div><div class="stat"><span>الحفظ</span><b style="font-size:17px;color:var(--teal)">محلي وآمن</b></div></div><section class="card" style="margin-top:20px"><div class="section-head"><h2>المراحل التربوية المعتمدة</h2><span class="pill">${currentStages().length} مرحلة</span></div><p class="muted">التقويم التشخيصي، الوضعية المشكلة، المهام، التقويمات، تمحيص الفرضيات، القيم المستنبطة والتعلم الذاتي.</p></section>`}
function lessons(){let rows=(state.lessons||[]).map(l=>`<tr><td><b>${esc(l.lesson_title||l.title)}</b></td><td>${esc(l.level)}</td><td>${esc(l.school_year)}</td><td>${esc((l.updated_at||'').replace('T',' '))}</td><td><button class="secondary" onclick="editLesson('${l.id}')">فتح</button> <button class="danger" onclick="removeLesson('${l.id}')">حذف</button></td></tr>`).join('');return header('جذاذاتي','إدارة الجذاذات المحفوظة محلياً')+`<section class="card"><div class="toolbar"><input id="search" placeholder="ابحث في الجذاذات..." oninput="filterLessons()" style="padding:12px;border:1px solid var(--line);border-radius:10px;width:280px"><button class="primary" onclick="newLesson()">＋ جذاذة جديدة</button></div><div class="tablewrap"><table class="lessons"><thead><tr><th>عنوان الدرس</th><th>المستوى</th><th>السنة الدراسية</th><th>آخر تعديل</th><th>الإجراءات</th></tr></thead><tbody id="lessonRows">${rows||'<tr><td colspan="5" class="empty">لا توجد جذاذات محفوظة بعد.</td></tr>'}</tbody></table></div></section>`}
function filterLessons(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('#lessonRows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function templates(){return header('القوالب','المراحل الثابتة قابلة لإعادة الاستخدام')+`<section class="card"><div class="section-head"><h2>القالب الأساسي</h2><span class="pill">${currentStages().length} مرحلة</span></div><p class="muted">هذا القالب يحافظ على المنهجية التربوية الرسمية، ويمكن استعماله لإنشاء جذاذة جديدة.</p><button class="primary" onclick="newLesson()">استخدام القالب</button></section>`}
function settings(){return header('الإعدادات','بيانات الأستاذ والنسخ الاحتياطي')+`<section class="card"><div class="grid"><div class="field"><label>اسم الأستاذ</label><input id="setTeacher" value="${esc(state.settings?.teacher)}"></div><div class="field"><label>المؤسسة</label><input id="setInstitution" value="${esc(state.settings?.institution)}"></div></div><button class="primary" style="margin-top:18px" onclick="saveSettings()">حفظ الإعدادات</button></section><section class="card"><h2>البيانات</h2><p class="muted">يمكنك إنشاء نسخة احتياطية أو استرجاع بيانات سابقة.</p><div class="actions"><button class="secondary" onclick="backup()">نسخ احتياطي</button><button class="secondary" onclick="restore()">استرجاع نسخة</button></div></section>`}
function currentStages(){return current?.stages||state.templates?.[0]?.stages||[]}
function newLesson(){current={id:crypto.randomUUID?.()||Date.now().toString(),title:'جذاذة جديدة',subject:'التربية الإسلامية',domain:'التزكية (عقيدة)',stages:JSON.parse(JSON.stringify(state.templates?.[0]?.stages||[])),created_at:new Date().toISOString()};activeStage=0;view='editor';render()}
function editLesson(id){current=JSON.parse(JSON.stringify(state.lessons.find(x=>x.id===id)));activeStage=0;view='editor';render()}
function editor(){let s=currentStages()[activeStage]||{};return header('محرر الجذاذة','تُحفظ التعديلات محلياً أثناء العمل')+`<div class="toolbar"><div class="actions"><button class="primary" onclick="saveCurrent()">حفظ الجذاذة</button><button class="secondary" onclick="openPreview()">معاينة كاملة</button></div><button class="iconbtn" onclick="go('lessons')">رجوع إلى الجذاذات</button></div><div class="editor-layout"><section class="card stage-nav"><h3>مراحل الجذاذة</h3>${currentStages().map((x,i)=>`<button class="stage-item ${i===activeStage?'active':''}" onclick="activeStage=${i};render()"><span class="num">${i+1}</span><span>${esc(x.name)}</span></button>`).join('')}</section><section class="card form-card">${activeStage===0?basics():stageForm(s)}</section></div>`}
function basics(){let fields=[['المؤسسة','institution'],['الأكاديمية','academy'],['المديرية','directorate'],['الأستاذ','teacher'],['المستوى','level'],['السنة الدراسية','school_year'],['المدخل','entry'],['المجال','domain'],['الوحدة','unit'],['عنوان الدرس','lesson_title'],['عدد الحصص','sessions'],['مدة الحصة','period'],['التاريخ','date']];return `<div class="section-head"><h2>المعلومات الأساسية</h2><span class="pill">بيانات الدرس</span></div><div class="grid">${fields.map(([l,k])=>`<div class="field"><label>${l}</label><input value="${esc(current[k])}" onchange="current['${k}']=this.value"></div>`).join('')}<div class="field full"><label>الكفاية</label><textarea onchange="current.competency=this.value">${esc(current.competency)}</textarea></div><div class="field full"><label>الأهداف والموارد والمراجع</label><textarea onchange="current.objectives=this.value.split('\\n')">${esc((current.objectives||[]).join('\\n'))}</textarea></div></div>`}
function stageForm(s){let idx=activeStage;let common=`<div class="stage-note"><b>${esc(s.name)}</b><br>${esc(s.purpose)}</div>`;if(s.kind==='problem')return common+textField('الوضعية المشكلة','problem',s)+textField('دراسة الوضعية والتفاعل','study_text',s)+repeatHyp(s);if(s.kind==='task')return common+['title','goal','duration','teacher','learner','summary'].map((k,i)=>textField(['عنوان المهمة','الهدف','المدة','أنشطة الأستاذ','أنشطة المتعلم','الخلاصة'][i],k,s)).join('')+repeatSimple(s,'evidences','السندات')+repeatQuestions(s);if(['diagnostic','formative','summative'].includes(s.kind))return common+repeatQuestions(s);if(s.kind==='scrutiny')return common+`<p class="muted">تظهر الفرضيات السابقة هنا تلقائياً لتسجيل الحكم والدليل والتعليل.</p>`+((current.stages.find(x=>x.kind==='problem')?.hypotheses)||[]).map((h,i)=>`<div class="repeat"><b>الفرضية ${i+1}: ${esc(h.text)}</b>${textField('الحكم','judgment',h,'select')} ${textField('الدليل','evidence',h)} ${textField('التعليل النهائي','final_reason',h)}</div>`).join('');if(s.kind==='values')return common+repeatValues(s);if(s.kind==='self_learning')return common+['task','instructions','product','resources','deadline'].map((k,i)=>textField(['المهمة','التعليمات','المنتوج المنتظر','الموارد','الأجل'][i],k,s)).join('');return common+repeatSimple(s,'activities','الأنشطة')}
function textField(label,key,obj,type='textarea'){if(type==='select'){return `<div class="field" style="margin-bottom:14px"><label>${label}</label><select onchange="current.stages[${activeStage}].results=current.stages[${activeStage}].results||[]; current.stages[${activeStage}].results[0]=current.stages[${activeStage}].results[0]||{}; current.stages[${activeStage}].results[0]['${key}']=this.value"><option value="">اختر الحكم</option><option ${obj[key]==='صحيحة'?'selected':''}>صحيحة</option><option ${obj[key]==='غير صحيحة'?'selected':''}>غير صحيحة</option><option ${obj[key]==='تحتاج إلى تعديل'?'selected':''}>تحتاج إلى تعديل</option></select></div>`}return `<div class="field" style="margin-bottom:14px"><label>${label}</label><textarea onchange="setVal(${activeStage},'${key}',this.value)">${esc(obj[key]||'')}</textarea></div>`}
function setVal(i,k,v){current.stages[i][k]=v}
function repeatHyp(s){s.hypotheses=s.hypotheses||[];return `<div class="section-head"><h3>الفرضيات</h3><button class="secondary" onclick="sAdd('hypotheses',{})">＋ إضافة فرضية</button></div>${s.hypotheses.map((x,i)=>`<div class="repeat"><div class="repeat-head"><b>الفرضية ${i+1}</b><button class="danger" onclick="sDel('hypotheses',${i})">حذف</button></div><div class="repeat-grid"><div class="field"><label>الفرضية الأصلية</label><textarea onchange="current.stages[${activeStage}].hypotheses[${i}].text=this.value">${esc(x.text)}</textarea></div><div class="field"><label>التعليل الأصلي</label><textarea onchange="current.stages[${activeStage}].hypotheses[${i}].original_reason=this.value">${esc(x.original_reason)}</textarea></div></div></div>`).join('')}`}
function repeatSimple(s,key,title){s[key]=s[key]||[];return `<div class="section-head"><h3>${title}</h3><button class="secondary" onclick="sAdd('${key}',{text:''})">＋ إضافة</button></div>${s[key].map((x,i)=>`<div class="repeat"><div class="repeat-head"><b>العنصر ${i+1}</b><button class="danger" onclick="sDel('${key}',${i})">حذف</button></div><div class="field"><textarea onchange="current.stages[${activeStage}]['${key}'][${i}].text=this.value">${esc(x.text||x)}</textarea></div></div>`).join('')}`}
function repeatQuestions(s){s.questions=s.questions||[];return `<div class="section-head"><h3>الأسئلة والأجوبة المتوقعة</h3><button class="secondary" onclick="sAdd('questions',{question:'',expected:''})">＋ إضافة سؤال</button></div>${s.questions.map((x,i)=>`<div class="repeat"><div class="repeat-head"><b>السؤال ${i+1}</b><button class="danger" onclick="sDel('questions',${i})">حذف</button></div><div class="repeat-grid"><div class="field"><label>السؤال</label><textarea onchange="current.stages[${activeStage}].questions[${i}].question=this.value">${esc(x.question)}</textarea></div><div class="field"><label>الإجابة المتوقعة</label><textarea onchange="current.stages[${activeStage}].questions[${i}].expected=this.value">${esc(x.expected)}</textarea></div></div></div>`).join('')}`}
function repeatValues(s){s.values=s.values||[];return repeatSimple(s,'values','القيم المستنبطة')}
function sAdd(k,v){current.stages[activeStage][k]=current.stages[activeStage][k]||[];current.stages[activeStage][k].push(v);render()}function sDel(k,i){current.stages[activeStage][k].splice(i,1);render()}
function saveCurrent(){let i=state.lessons.findIndex(x=>x.id===current.id);current.updated_at=new Date().toISOString();if(i<0)state.lessons.push(current);else state.lessons[i]=current;api('save_lesson',current);toast('تم حفظ الجذاذة محلياً');}
function saveSettings(){state.settings.teacher=document.getElementById('setTeacher').value;state.settings.institution=document.getElementById('setInstitution').value;api('state');toast('تم حفظ الإعدادات')}
async function removeLesson(id){if(confirm('هل تريد حذف الجذاذة؟')){state.lessons=state.lessons.filter(x=>x.id!==id);await api('delete_lesson',id);render();toast('تم حذف الجذاذة')}}
async function backup(){let r=await api('backup');if(r?.ok)toast('تم إنشاء النسخة الاحتياطية')}async function restore(){let r=await api('restore');if(r?.ok){state=r.state;render();toast('تم الاسترجاع بنجاح')}}
function openPreview(){saveCurrent();let rows=currentStages().map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(activity(s))}</td><td>${esc((s.abilities||[]).join('، '))}</td><td>${esc((s.aids||[]).join('، '))}</td><td>${esc((s.indicators||[]).join('، '))}</td></tr>`).join('');document.getElementById('preview').innerHTML=`<h2>${esc(current.lesson_title||current.title)}</h2><p>الأستاذ: ${esc(current.teacher)} | المستوى: ${esc(current.level)} | السنة: ${esc(current.school_year)}</p><table class="preview-table"><thead><tr><th>مراحل الدرس</th><th>الأنشطة الديداكتيكية التعلمية</th><th>القدرات</th><th>المعينات</th><th>مؤشرات التقويم</th></tr></thead><tbody>${rows}</tbody></table><div class="actions" style="margin-top:18px"><button class="primary" onclick="doExport('docx')">تصدير Word</button><button class="primary" onclick="doExport('pdf')">تصدير PDF</button><button class="secondary" onclick="doExport('html')">حفظ المعاينة</button></div>`;document.getElementById('modal').style.display='flex'}function activity(s){let a=[];['problem','study_text','title','goal','teacher','learner','summary','task','instructions','product','resources'].forEach(k=>{if(s[k])a.push(s[k])});['questions','evidences','hypotheses','values'].forEach(k=>(s[k]||[]).forEach(x=>a.push(Object.values(x).filter(Boolean).join(' | '))));return a.join('\n')}function closePreview(){document.getElementById('modal').style.display='none'}async function doExport(k){let r=await api('export',k,current);if(r?.ok)toast('تم إنشاء الملف بنجاح')}function go(v){view=v;render()}function render(){document.getElementById('app').innerHTML=shell()}window.addEventListener('pywebviewready',async()=>{let x=await api('state');if(x)state=x;render()});render();
</script></body></html>
