name: Windows Build


on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'


jobs:
  build-windows:
    runs-on: windows-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .build_env
          .\.build_env\Scripts\python.exe -m pip install --upgrade pip
          .\.build_env\Scripts\python.exe -m pip install pyinstaller reportlab weasyprint


      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\app"
          .\.build_env\Scripts\python.exe -m py_compile app\main.py
          .\.build_env\Scripts\python.exe test_core.py
          .\.build_env\Scripts\python.exe test_exports.py
          .\.build_env\Scripts\python.exe test_lifecycle.py


      - name: Build EXE
        shell: pwsh
        run: |
          .\.build_env\Scripts\python.exe -m PyInstaller --clean Tarbawi-Jodada.spec
          New-Item -ItemType Directory -Force -Path release\Tarbawi-Jodada-Portable | Out-Null
          Copy-Item dist\Tarbawi-Jodada.exe release\Tarbawi-Jodada-Portable\Tarbawi-Jodada.exe


      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\dist\Tarbawi-Jodada.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "The packaged application exited before the smoke test completed." }
          Stop-Process -Id $p.Id -Force


      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress


      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not found after installation." }
          & $iscc "$PWD\Tarbawi-Jodada.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
          if (-not (Test-Path release\Tarbawi-Jodada-Setup.exe)) { throw "Setup.exe was not created." }


      - name: Smoke test installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _install_test | Out-Null
